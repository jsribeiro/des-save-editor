name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FYNE_TOOL: fyne.io/tools/cmd/fyne@v1.7.3
  # Fyne's GLFW backend builds both X11 and Wayland support.
  LINUX_DEPS: gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install Fyne packaging tool
        run: go install ${{ env.FYNE_TOOL }}

      - name: Build macOS app
        if: matrix.name == 'macos'
        run: make macos

      - name: Build Linux package and command-line tools
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
          make linux cli

      - name: Set up MSYS2 (gcc and make)
        if: matrix.name == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: Build Windows app
        if: matrix.name == 'windows'
        shell: msys2 {0}
        run: make windows MINGW_CC=gcc FYNE="$(cygpath "$(go env GOPATH)")/bin/fyne.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.xz
            dist/*.exe
            dist/dessave-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
